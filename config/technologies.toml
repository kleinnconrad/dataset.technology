# Registry of the technologies tracked by the tech dataset.
#
# Every [[technology]] entry has a stable id (the join key technology_id of the datasets),
# a display name, a category (TechnologyCategory in src/schema.py) and the date on which it
# was added. The other keys are the identifiers of the technology at the sources:
#   wikidata            Wikidata id; the English Wikipedia article is resolved at run time
#   stackoverflow_tags  Stack Overflow master tags
#   github_repos        main GitHub repositories (owner/name)
#   packages            npm:, pypi:, crates: packages and docker: images (adoption proxies)
#   endoflife           product slug at endoflife.date
#   hn_terms            lower-case terms counted in Hacker News titles and comments
#   github_language     language name in GitHub Linguist
# The comment line above each entry holds the English Wikipedia title at the time of the
# verification.
#
# Rules (CLAUDE.md, section 9): ids are never changed or reused; a technology that is no
# longer tracked keeps its entry with removed = <date> and removed_reason = "..."; every new
# or changed identifier is verified against the live source before it is committed; each
# identifier belongs to one entry only.
#
# All identifiers of the initial entries were verified on 2026-10-25.

